name: Lint

on:
    push:
        branches:
            - master
            - dev
    pull_request:
        branches:
            - master
            - dev

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
        - name: Checkout Code
          uses: actions/checkout@v2
        - name: Set up Python 3.12
          uses: actions/setup-python@v5
          with:
              python-version: 3.12
        - name: Install the latest version of uv
          uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
          with:
              enable-cache: true
              version: "0.7.6"

        - name: Install formatters
          run: uv sync --only-group lint

        - name: Check clang-format version
          run: uv run --no-sync clang-format --version

        - name: check
          env:
            CLANG_FORMAT: clang-format
          run: |
            uv run --no-sync bash format.sh

        - name: Fail if format.sh modified files
          run: |
            if ! git diff --quiet -- . ':!uv.lock'; then
              echo "::error::Files are not properly formatted. Please run ./format.sh locally and commit the changes."
              echo "--- git diff (summary) ---"
              git --no-pager diff -- . ':!uv.lock'
              exit 1
            fi
